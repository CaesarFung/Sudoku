<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="極簡多語言數獨遊戲，支援6種解題技巧提示">
    <title>Caesar的數獨遊戲</title>
    
    <link rel="stylesheet" href="style.css?v=20260811-ios2">
</head>
<body>
    <div class="main-layout">
        <div id="sudoku-grid" class="grid-container"></div>

        <div class="controls-panel">
            <div class="header-row">
                <span id="timer" class="timer-display">⏱️ 00:00</span>
                <span id="status" aria-live="polite" class="status-display"></span>
                <span class="error-display">❌ <span id="error-count">3</span>/3</span>
            </div>

            <div class="button-row answer-row">
                <button class="kbd-btn answer-btn" data-num="1">1</button>
                <button class="kbd-btn answer-btn" data-num="2">2</button>
                <button class="kbd-btn answer-btn" data-num="3">3</button>
                <button class="kbd-btn answer-btn" data-num="4">4</button>
                <button class="kbd-btn answer-btn" data-num="5">5</button>
                <button class="kbd-btn answer-btn" data-num="6">6</button>
                <button class="kbd-btn answer-btn" data-num="7">7</button>
                <button class="kbd-btn answer-btn" data-num="8">8</button>
                <button class="kbd-btn answer-btn" data-num="9">9</button>
            </div>

            <div class="button-row candidate-row">
                <button class="kbd-btn candidate-btn" data-num="1">1</button>
                <button class="kbd-btn candidate-btn" data-num="2">2</button>
                <button class="kbd-btn candidate-btn" data-num="3">3</button>
                <button class="kbd-btn candidate-btn" data-num="4">4</button>
                <button class="kbd-btn candidate-btn" data-num="5">5</button>
                <button class="kbd-btn candidate-btn" data-num="6">6</button>
                <button class="kbd-btn candidate-btn" data-num="7">7</button>
                <button class="kbd-btn candidate-btn" data-num="8">8</button>
                <button class="kbd-btn candidate-btn" data-num="9">9</button>
            </div>

            <div class="utility-row">
                <button id="auto-candidates-btn" class="utility-icon-btn" data-i18n-title="notes">
                    <span class="icon">📝</span>
                </button>
                <button id="hint-btn" class="utility-icon-btn" data-i18n-title="hint">
                    <span class="icon">💡<span class="badge" id="hint-count">3</span></span>
                </button>
                <button id="pause-btn" class="utility-icon-btn" data-i18n-title="settings">
                    <span class="icon-settings"></span>
                </button>
            </div>
        </div>
    </div>

    <div id="console-toast" class="console-toast"></div>

    <!-- 暫停菜單模板 (隱藏，由 JS 複製使用) -->
    <template id="pause-menu-template">
        <div class="pause-overlay">
            <button class="resume-btn" data-i18n-text="resume">繼續遊戲</button>
            <div class="new-game-text" data-i18n-text="newGame">新遊戲</div>
            <div class="difficulty-buttons">
                <button class="difficulty-btn" data-level="intro" data-i18n-text="intro">入門</button>
                <button class="difficulty-btn" data-level="easy" data-i18n-text="easy">簡單</button>
                <button class="difficulty-btn" data-level="medium" data-i18n-text="medium">普通</button>
                <button class="difficulty-btn" data-level="hard" data-i18n-text="hard">困難</button>
                <button class="difficulty-btn" data-level="expert" data-i18n-text="expert">地獄</button>
            </div>
        </div>
    </template>

    <script src="i18n.js?v=20260811-ios2"></script>
    <script src="script.js?v=20260811-ios2"></script>
    <script src="i18n-integration.js?v=20260811-ios2"></script>
</body>
</html>
